<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Design Portfolio</title>
    <link rel="stylesheet" href="graphic.css">
</head>
<body class="graphic-page">

  <header class="page-header">
    <a href="portfolio.html" class="back-btn">
      <span class="arrow">←</span> BACK
    </a>
    <h1 class="main-title">Graphic Design</h1>
  </header>

  <main class="content-wrapper">

    <section class="design-category visual-comm">
  <div class="category-info">
    <h2>Visual<br>Communication<br>Design</h2>
  </div>
  
  <div class="carousel-container">
    <div class="carousel-track">
      <div class="carousel-item" 
        data-title="Perfect - Illustration Design"
        data-objective="Explore the tension between perfection and individuality through stylized portraiture and graphic composition."
        data-approach="Integrating geometric elements, bold typography, and symbolic character design to evoke a futuristic aesthetic."
        data-tools="Photoshop / Digital Illustration / Visual Identity Experimentation &#10; ">
        <img src="image_ps/DB/13.jpg" alt="1" loading="lazy"decoding="async">
      </div>

      <div class="carousel-item" 
        data-title="Art Posters - Little Elf"
        data-objective="Capture the vibrant essence and liberated spirit of a hummingbird as a tiny, radiant symbol of freedom."
        data-approach="Grid-based layout with fragmented empty cells + poetic text integration + dynamic iridescent hummingbird as focal point, blending minimalism with lively energy."
        data-tools="Photoshop / Digital collage & typography &#10; Evocative mood achieved through contrast and negative space.">
        <img src="image_ps/DB/14.jpg" alt="2" loading="eager"decoding="async">
      </div>

      <div class="carousel-item" 
        data-title="Restaurant Promotion - Poster"
        data-objective="Promote a gourmet filet mignon dish with an elegant, appetite-driven visual that highlights fresh ingredients, luxurious presentation, and a limited-time 20% signature discount."
        data-approach="Dark moody background + overlapping gourmet food photography + layered, distressed typography for a premium yet approachable fine-dining feel; strategic text placement to guide eye from dish → offer → quote."
        data-tools="Photoshop / Stock food photography / Typographic overlays  &#10; Successful luxurious yet inviting tone;Successful luxurious yet inviting tone; discount stands out clearly.">
        <img src="image_ps/DB/20.jpg" alt="3">
      </div>

      <div class="carousel-item" 
        data-title="Summer Soul 2023 - KUUGA(Ultimate Form)"
        data-objective="Promote the Summer Soul 2023 Toys & Games Fair in Hong Kong, spotlighting Masked Rider Kuuga Ultimate Form as the iconic hero centerpiece to attract tokusatsu fans and collectors."
        data-approach="Dark cosmic background with red sun motif + dramatic full-body Kuuga pose + bold vertical/horizontal type hierarchy in crimson & gold; smoky effects and cracked texture to evoke heroic intensity and event energy."
        data-tools="Photoshop / Figure photography composite / Typographic distortion  &#10; Powerful hero worship vibe achieved with strong color contrast and dynamic composition.">
        <img src="image_ps/DB/10.jpg" alt="4">
      </div>

      <div class="carousel-item" 
        data-title="Fashion & Art - Fashionable Aunt"
        data-objective="Celebrate timeless, confident fashion as an empowering expression of modern femininity, positioning the design as bold, unforgettable style for the contemporary woman."
        data-approach="High-contrast black-and-white portrait + oversized, fragmented typography that integrates with the figure + elegant serif subtitle for sophistication; minimal color to emphasize attitude, luxury accessories, and raw confidence."
        data-tools="Photoshop / High-res portrait retouching / Typographic layering &#10; Iconic, empowering mood captured through scale and negative space; text feels integrated rather than overlaid.">
        <img src="image_ps/DB/4.jpg" alt="5">
      </div>

      <div class="carousel-item" 
        data-title="Adobe Creative Cloud - Photoshop"
        data-objective="Create a modern, nostalgic tribute to Adobe Photoshop as a powerful creative tool, visualized as a sleek 2025 software “disc” to evoke innovation, imagination, and digital artistry."
        data-approach="Circular CD/DVD-inspired composition + gradient blue sky background + scattered iconic tool icons + bold typographic integration around the disc edge; clean, futuristic layout with subtle depth and reflection effects."
        data-tools="Photoshop / Vector shapes / Gradient mapping &#10; Successful blend of retro disc aesthetic with contemporary branding; strong focal point and tool symbolism.">
        <img src="image_ps/DB/43.jpg" alt="6">
      </div>

      <div class="carousel-item" 
        data-title="Art Posters - Walking with Insects"
        data-objective="Illustrate the core principle of good design through a simple, memorable visual metaphor: balancing playful aesthetics with clean functionality."
        data-approach="Red grid background for structured functionality + oversized white swoosh for dynamic aesthetics + centered ladybug as a charming, unexpected focal symbol; minimal text hierarchy with deliberate spacing for readability and impact."
        data-tools="Photoshop / Vector illustration & grid layout &#10; Effective contrast between organic (ladybug/swoosh) and geometric (grid) elements achieved; message lands clearly and playfully.">
        <img src="image_ps/DB/22.jpg" alt="7">
      </div>
      
      <div id="image-modal" class="modal">
        <span class="close-modal">&times;</span>
        <div class="modal-content modal-split">
    
          <!-- 圖片 -->
          <div class="modal-image">
              <img id="modal-img" src="" alt="Full View">
          </div>

          <!--文字介紹 -->
          <div class="modal-text">
              <h3 id="modal-title"></h3>

              <div class="modal-section">
                  <h4>Objective</h4>
                  <p id="modal-objective"></p>
              </div>

              <div class="modal-section">
                  <h4>Approach</h4>
                  <p id="modal-approach"></p>
              </div>

              <div class="modal-section">
                  <h4>Tools & Reflection</h4>
                  <p id="modal-tools"></p>
              </div>
          </div>
        </div>



      </div>
    </div>
    
    <div class="carousel-controls">
      <button class="control-btn prev">←</button>
      <button class="control-btn next">→</button>
    </div>
  </div>
</section>

    <hr class="section-divider">

  <section class="design-category branding">
  <div class="category-info">
    <h2>Branding<br>Design</h2>
  </div>

  <div class="branding-showcase">
    <div class="thumb-column left-col">
      <div class="thumb-item active" 
           data-full="image_ps/DB/18.jpg" 
           data-title="Pepsi Promotional Poster 01" 
           data-desc="
           Pepsi Max promotional posters feature a retro-modern background, 
           clearly presenting promotional information and highlighting new products.
           ">
        <img src="image_ps/DB/18.jpg" alt="Thumb 1" rel="preload" loading="eager"
     decoding="async">
      </div>
      <div class="thumb-item" 
           data-full="image_ps/DB/30.jpg" 
           data-title="Business Card - Concept Design" 
           data-desc="
           This is the business card design in the brand identity, 
           featuring a simple logo and soft pink background to convey modernity 
           and approachability, while emphasizing clear information and visual consistency.
           ">
        <img src="image_ps/DB/30.jpg" alt="Thumb 2" rel="preload">
      </div>
      <div class="thumb-item" 
           data-full="image_ps/DB/37.jpg" 
           data-title="Lamborghini - Visual Poster" 
           data-desc="
           The Lamborghini poster showcases speed and luxury 
           with its glossy black body and red tires, while the multi-angle 
           layout highlights details and brand style.
           ">
        <img src="image_ps/DB/37.jpg" alt="Thumb 3">
      </div>
      <div class="thumb-item" 
           data-full="image_ps/DB/33.jpg" 
           data-title="Chage - Shopping Bag Display 01" 
           data-desc="
           The Chagee tote bag features a white base with geometric 
           patterns and grey tones, presenting a modern and minimalist style. 
           Striking lettering and illustrations highlight the brand's distinctive character.
           ">
        <img src="image_ps/DB/33.jpg" alt="Thumb 4">
      </div>
    </div>

    <div class="main-display-area">
      <div class="main-image-wrapper">
        <img id="branding-main-img" src="image_ps/DB/18.jpg" alt="Main Display" loading="lazy"
     decoding="async">
      </div>
      <div class="main-text-content">
        <h3 id="branding-title">Pepsi Promotional Poster 01</h3>
        <hr class="text-divider">
        <p id="branding-desc">
          Pepsi Max promotional posters feature a retro-modern background, 
          clearly presenting promotional information and highlighting new products..
        </p>
      </div>
    </div>

    <div class="thumb-column right-col">
      <div class="thumb-item" 
           data-full="image_ps/DB/31.jpg" 
           data-title="Adobe Photoshop - Logo Design" 
           data-desc="
           This is a conceptual logo for Adobe Photoshop 2025, 
           featuring 3D typography and a paper-like background to emphasize 
           the brand's digital creativity and unique identity.
           ">
        <img src="image_ps/DB/31.jpg" alt="Thumb 5">
      </div>
      <div class="thumb-item" 
           data-full="image_ps/DB/28.jpg" 
           data-title="Pepsi Promotional Poster 02" 
           data-desc="
           The design showcases Pepsi's youthful and energetic image, 
           appealing to consumers who value style and instant gratification.
           ">
        <img src="image_ps/DB/28.jpg" alt="Thumb 6">
      </div>
      <div class="thumb-item" 
           data-full="image_ps/DB/42.jpg" 
           data-title="NACOSIL - 3D Packaging Design" 
           data-desc="
           The overall design aims to attract consumers' 
           attention and convey the product's professionalism and purpose.
           ">
        <img src="image_ps/DB/42.jpg" alt="Thumb 7">
      </div>
      <div class="thumb-item" 
           data-full="image_ps/DB/41.jpg" 
           data-title="Packaging Design Showcase" 
           data-desc="
           Showcase the outer packaging design. The design utilizes color 
           schemes and patterns to attract consumers' attention and clearly convey the product's features.
           ">
        <img src="image_ps/DB/41.jpg" alt="Thumb 8">
      </div>
    </div>
  </div>
  </section>

  </main>

  <script src="graphic.js"></script>
</body>
</html>
